name: Build index and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # Check the ZIP repository every hour. Scheduled workflows can start a few
    # minutes late when GitHub Actions is busy.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Synchronize FAFF0x ZIP mods
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOD_SOURCE_REPO: FAFF0x/gen1recomp
          MOD_SOURCE_REF: main
          MOD_INDEX_AUTHOR: FAFF0x
          FORCE_SYNC: ${{ github.event_name != 'schedule' }}
        run: node scripts/sync-personal-mods.mjs

      - name: Commit synchronized entries
        run: |
          changes=$(git status --porcelain -- mods .github/faff0x-source-state.json)
          if [ -z "$changes" ]; then
            echo "No metadata changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods .github/faff0x-source-state.json
          git commit -m "Sync FAFF0x mod ZIPs [skip ci]"
          git push

      - name: Build index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-index.mjs --releases

      - name: Summarize
        run: |
          {
            echo '### index.json'
            echo
            node -e "const i=require('./site/data/index.json');
              console.log('- ' + i.count + ' mod(s), generated ' + i.generated_at);
              for (const m of i.mods) console.log('- \`' + m.folder + '\` ' + (m.latest ? m.latest.version + ' (' + m.update_check + ')' : m.version + ' (' + m.update_check + ')'));"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
